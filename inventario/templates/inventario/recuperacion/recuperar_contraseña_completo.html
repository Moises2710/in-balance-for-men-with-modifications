{% load static %}
<!doctype html>
<html lang="es" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>In Balance | Contraseña Restablecida</title>

    <!-- Estilos de Hope UI -->
    <link rel="stylesheet" href="{% static 'assets/css/core/libs.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/hope-ui.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/custom.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/dark.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/customizer.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/rtl.min.css' %}">
    <link rel="shortcut icon" href="{% static 'assets/images/favicon.ico' %}">
  </head>

  <body>
    <div class="wrapper">
      <section class="login-content">
        <div class="row m-0 align-items-center bg-white vh-100">            
          <div class="col-md-6">
            <div class="row justify-content-center">
              <div class="col-md-10">
                <div class="card card-transparent shadow-none d-flex justify-content-center mb-0 auth-card">
                  <div class="card-body text-center">
                    <h2 class="mb-3">Contraseña Restablecida</h2>
                    <p class="mb-4">Tu contraseña ha sido restablecida correctamente.</p>
                    <a href="{% url 'login' %}" class="btn btn-primary">Volver al Login</a>
                  </div>
                </div>
              </div>
            </div>

            <!-- Fondo decorativo -->
            <div class="sign-bg">
              <svg width="280" height="230" viewBox="0 0 431 398" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g opacity="0.05">
                  <rect x="-157.085" y="193.773" width="543" height="77.5714" rx="38.7857"
                        transform="rotate(-45 -157.085 193.773)" fill="#3B8AFF"/>
                  <rect x="7.46875" y="358.327" width="543" height="77.5714" rx="38.7857"
                        transform="rotate(-45 7.46875 358.327)" fill="#3B8AFF"/>
                  <rect x="61.9355" y="138.545" width="310.286" height="77.5714" rx="38.7857"
                        transform="rotate(45 61.9355 138.545)" fill="#3B8AFF"/>
                  <rect x="62.3154" y="-190.173" width="543" height="77.5714" rx="38.7857"
                        transform="rotate(45 62.3154 -190.173)" fill="#3B8AFF"/>
                </g>
              </svg>
            </div>
          </div>

          <!-- Imagen decorativa lateral -->
          <div class="col-md-6 d-md-block d-none bg-primary p-0 mt-n1 vh-100 overflow-hidden">
            <img src="{% static 'assets/images/auth/01.png' %}" class="img-fluid gradient-main animated-scaleX" alt="fondo">
          </div>
        </div>
      </section>
    </div>

    <!-- Scripts -->
    <script src="{% static 'assets/js/core/libs.min.js' %}"></script>
    <script src="{% static 'assets/js/hope-ui.js' %}" defer></script>
  </body>
</html>
